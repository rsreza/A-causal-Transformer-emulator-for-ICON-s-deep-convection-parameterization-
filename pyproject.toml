[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icon-convection-transformer"
version = "0.1.0"
description = "A causal Transformer emulator for ICON's deep convection parameterization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Reza"}]
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
gpu = ["streamlit>=1.30", "jupyter>=1.0"]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.setuptools.packages.find]
include = ["src*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
